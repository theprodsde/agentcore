# AgentCore demo stack — no clone, no build, no .env required.
#
#   curl -fsSL https://raw.githubusercontent.com/theprodsde/agentcore/main/docker-compose.demo.yml -o agentcore-demo.yml
#   docker compose -f agentcore-demo.yml up
#
# Then open http://localhost:3000 — all tools run in simulation mode, so no
# API keys are needed. To use a real LLM for planning/synthesis:
#
#   OPENAI_API_KEY=sk-... docker compose -f agentcore-demo.yml up
#
# Tear down (including data): docker compose -f agentcore-demo.yml down -v

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentcore
      POSTGRES_PASSWORD: agentcore
      POSTGRES_DB: agentcore
    volumes:
      - agentcore_demo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcore"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${AGENTCORE_IMAGE:-ghcr.io/theprodsde/agentcore:latest}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://agentcore:agentcore@postgres:5432/agentcore
      # Optional: pass through from your shell for real LLM planning/synthesis
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  agentcore_demo_pg:
