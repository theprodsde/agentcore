name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster it gets fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I run X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Start the server with `npm run dev`
        2. POST /api/tasks with goal "..."
        3. See error in the response / logs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "The task should complete and return a final_output."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traces
      description: Paste any error output, Pino log lines, or Jaeger trace IDs.
      render: shell

  - type: dropdown
    id: phase
    attributes:
      label: Which part of the system is affected?
      options:
        - Task orchestrator (executor)
        - MCP tools (search_logs / get_metrics / create_ticket / list_services)
        - Memory retrieval (pgvector)
        - Auth / JWT
        - Slack integration
        - Database / migrations
        - Dashboard / frontend
        - CI / build
        - Other
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: "e.g. 22.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 15, Ubuntu 24.04, Docker on ARM64"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I can reliably reproduce this
          required: true
